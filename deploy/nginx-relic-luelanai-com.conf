# relic.luelanai.com — Relic.skill 演示站（易科云服务器 · 2026-10-14 迁移版）
#
# 远端安装位置：/etc/nginx/sites-available/relic-demo → 软链到 sites-enabled/
# 静态文件目录：/var/www/relic-demo（由 deploy-demo.sh / rsync 上传）
# 证书：/etc/letsencrypt/live/relic.luelanai.com/（certbot 已签发 2026-10-14，自动续期）
#
# ⚠️ Cloudflare：luelanai.com 的 DNS 在 Cloudflare（橙云代理）
#   - CF→用户：CF 边缘证书；CF→源站：本机 LE 证书（CF SSL 模式 Full）
#   - certbot 续期由 systemd timer 自动执行；证书路径固定，续期自动 reload
#   - 换服务器时：改 CF 记录 + 在新机重签即可
#
# 部署顺序：上传文件 → 本配置 → nginx -t → reload
# （背景与完整流程见 .reference/演示站迁移部署准备-2026-10-14.md）

# ══════════ 80：ACME 挑战 + 跳转 ══════════
server {
    listen 80;
    server_name relic.luelanai.com;

    # Let's Encrypt HTTP-01 挑战目录（与同机 hy.intervip.lol 的 webroot 一致）
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ══════════ 443：站点本体 ══════════
server {
    listen 443 ssl;
    server_name relic.luelanai.com;

    ssl_certificate /etc/letsencrypt/live/relic.luelanai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relic.luelanai.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/relic-demo;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri.html $uri/ =404;   # Next.js 静态导出的路由兼容
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_static on;          # 配合 deploy-demo.sh 的 .gz 预压缩产物
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
}
