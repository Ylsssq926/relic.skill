# relic.intervip.lol — Relic.skill 演示站（易科云服务器 · 2026-10-14 迁移版）
#
# ⚠️ 本文件为【回退备选】：2026-10-14 晚主路线已切换为 relic.luelanai.com
#    （主路线配置见 nginx-relic-luelanai-com.conf）；若 Cloudflare 路线未能落地，可切回本方案。
#
# 远端安装位置：/etc/nginx/sites-available/relic-demo → 软链到 sites-enabled/
# 静态文件目录：/var/www/relic-demo（由 deploy-demo.sh / rsync 上传）
#
# 执行顺序（首次部署）：
#   1) 先只启用下面【第 1 步】的 80 端口 server 块 → nginx -t → systemctl reload nginx
#   2) 签证书：certbot --nginx -d relic.intervip.lol
#      —— certbot 会自动补上 ssl_certificate 行、生成 443 块并把 80 改成跳转
#   3) 用文末【参考：443 目标态】核对 certbot 生成结果（行为差异时以本文件目标态为准）

# ══════════ 第 1 步：80 端口（ACME 挑战 + 跳转）══════════
server {
    listen 80;
    server_name relic.intervip.lol;

    # Let's Encrypt HTTP-01 挑战目录（与同机 hy.intervip.lol 的 webroot 一致）
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

